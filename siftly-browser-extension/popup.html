<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siftly Saver</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 320px;
      background: #18181b;
      color: #e4e4e7;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .header img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }
    .header span {
      font-weight: 700;
      font-size: 15px;
      color: #f4f4f5;
    }
    .header span span { color: #F5A623; }
    .field { margin-bottom: 12px; }
    .label {
      font-size: 11px;
      font-weight: 600;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    input[type="text"], textarea, select {
      width: 100%;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      color: #e4e4e7;
      font-size: 13px;
      padding: 8px 10px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus, textarea:focus, select:focus {
      border-color: #6366f1;
    }
    textarea {
      resize: vertical;
      min-height: 60px;
      font-family: inherit;
    }
    .tags-input {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: 6px 8px;
      min-height: 38px;
      cursor: text;
    }
    .tags-input:focus-within { border-color: #6366f1; }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #3f3f46;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 11px;
      color: #a1a1aa;
    }
    .tag button {
      background: none;
      border: none;
      color: #71717a;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      padding: 0;
    }
    .tag button:hover { color: #e4e4e7; }
    .tags-input input {
      border: none;
      background: transparent;
      outline: none;
      color: #e4e4e7;
      font-size: 12px;
      min-width: 80px;
      flex: 1;
      padding: 2px 0;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary {
      background: #6366f1;
      color: white;
    }
    .btn-primary:hover { background: #4f46e5; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: #27272a;
      color: #a1a1aa;
      border: 1px solid #3f3f46;
      margin-top: 8px;
    }
    .btn-secondary:hover { background: #3f3f46; color: #e4e4e7; }
    .status {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      text-align: center;
      display: none;
    }
    .status.success { display: block; background: #166534; color: #86efac; }
    .status.error { display: block; background: #7f1d1d; color: #fca5a5; }
    .status.loading { display: block; background: #1e1b4b; color: #a5b4fc; }
    .preview {
      background: #27272a;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #3f3f46;
    }
    .preview-title {
      font-size: 12px;
      font-weight: 600;
      color: #a1a1aa;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .preview-url {
      font-size: 10px;
      color: #52525b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .divider {
      border: none;
      border-top: 1px solid #3f3f46;
      margin: 12px 0;
    }
    .settings-link {
      display: block;
      text-align: center;
      font-size: 11px;
      color: #52525b;
      text-decoration: none;
      margin-top: 12px;
    }
    .settings-link:hover { color: #71717a; }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="Siftly" onerror="this.style.display='none'">
    <span>Sift<span>ly</span></span>
  </div>

  <div id="not-configured" style="display:none;">
    <p style="font-size:13px;color:#71717a;margin-bottom:12px;text-align:center;">
      Set your Siftly server URL in extension options first.
    </p>
    <button class="btn btn-secondary" id="open-options">Open Options</button>
  </div>

  <div id="main-ui">
    <div class="preview">
      <div class="preview-title" id="page-title">Loading…</div>
      <div class="preview-url" id="page-url">—</div>
    </div>

    <div class="field">
      <div class="label">Notes (optional)</div>
      <textarea id="notes" placeholder="Add your notes here…"></textarea>
    </div>

    <div class="field">
      <div class="label">Tags</div>
      <div class="tags-input" id="tags-container">
        <input type="text" id="tag-input" placeholder="Type and press Enter…">
      </div>
    </div>

    <button class="btn btn-primary" id="save-btn">Save to Siftly</button>
    <div class="status" id="status"></div>

    <hr class="divider">

    <button class="btn btn-secondary" id="save-and-fetch">Save + Fetch Content</button>
  </div>

  <a href="#" class="settings-link" id="settings-link">Extension Settings</a>

  <script src="popup.js"></script>
</body>
</html>
